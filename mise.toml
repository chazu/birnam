# mise (https://mise.jdx.dev) — pins the toolchain and exposes common tasks.
#   mise run clean          # remove generated outputs and project artifacts
#   mise install            # fetch the pinned Zig
#   mise run build          # zig build (Debug)
#   mise run verify         # full native + self-hosted + REPL test gate
#   mise run rust-check     # offline Cargo check for the isolated Rust workspace
#   mise run rust-test      # offline Cargo tests for the isolated Rust workspace
#   mise run rust-shell-smoke # build and probe the spike-only Rust dylib
#   mise run rust-ffi-abort-smoke # prove fatal Rust C-ABI boundary behavior
#   mise run rust-heap-layout-smoke # probe Rust blocks from an external fixture
#   mise run rust-membership-bench # benchmark optimized Rust membership scaling
#   mise run rust-dispatch-reentry-smoke # reenter Rust send from a Zig Method
#   mise run rust-id-spike-smoke # exercise the spike IdApi from a Zig client
#   mise run rust-gc-metadata-smoke # retain GC metadata without collecting
#   mise run rust-env-loader-smoke # reflect exports and reload through Rust
#   mise run scalar-conformance-smoke # compare boxed scalars on both floors
#   mise run string-conformance-smoke # compare copied byte Strings on both floors
#   mise run prototype-conformance-smoke # compare prototypes on both floors
#   mise run rust-store-mop-smoke # prove Store MOP consistency on Rust
#   mise run rust-lower-rung-matrix # isolated first downstream matrix
#   mise run bootstrap-smoke # build a fixture-free source archive with pinned tools
#   mise run install        # install to a prefix
#   mise run dist           # build a release tarball for this platform
#   mise run release minor  # bump version, tag, build, publish a GitHub release
#   mise run bench          # full benchmark run (ReleaseSafe) -> bench/results/dev/
#   mise run bench-release  # tracked snapshot -> bench/results/v<VERSION>.json
#                           # (run AFTER release, on the tagged commit; commit the file)
#   mise run bench-compare bench/results/v0.8.0.json bench/results/dev/bench-<sha>.json

[tools]
zig = "0.15.1"
rust = "1.95.0"

[tasks.build]
description = "Build everything (Debug)"
run = "zig build"

[tasks.clean]
description = "Remove generated build outputs, Zig cache, and project artifacts"
run = "rm -rf .zig-cache zig-out .birnam .cargo-target"

[tasks.rust-check]
description = "Check the Rust floor workspace without network access"
run = "CARGO_TARGET_DIR=.cargo-target cargo check --workspace --locked --offline"

[tasks.rust-test]
description = "Test the Rust floor workspace without network access"
run = "CARGO_TARGET_DIR=.cargo-target cargo test --workspace --locked --offline"

[tasks.rust-shell-smoke]
description = "Build and directly probe the spike-only Rust floor dylib"
run = "bash scripts/rust-floor-shell-smoke.sh"

[tasks.rust-ffi-abort-smoke]
description = "Prove Rust panic and invariant failures abort at the C ABI boundary"
run = "bash scripts/rust-ffi-abort-smoke.sh"

[tasks.rust-heap-layout-smoke]
description = "Probe Rust raw block layout from an external C-ABI fixture"
run = "bash scripts/rust-heap-layout-smoke.sh"

[tasks.rust-membership-bench]
description = "Benchmark optimized Rust exact-address membership scaling"
run = "bash scripts/rust-membership-bench.sh"

[tasks.rust-dispatch-reentry-smoke]
description = "Reenter Rust dispatch synchronously from an external Zig Method"
run = "bash scripts/rust-dispatch-reentry-smoke.sh"

[tasks.rust-id-spike-smoke]
description = "Exercise the complete-shaped Rust IdApi from a frozen Zig client"
run = "bash scripts/rust-id-spike-smoke.sh"

[tasks.rust-gc-metadata-smoke]
description = "Retain collector metadata while Rust collection remains disabled"
run = "bash scripts/rust-gc-metadata-smoke.sh"

[tasks.rust-env-loader-smoke]
description = "Reflect canonical exports and reload a fixture through Rust"
run = "bash scripts/rust-env-loader-smoke.sh"

[tasks.scalar-conformance-smoke]
description = "Run boxed scalar conformance against Zig and Rust floors"
run = "bash scripts/scalar-conformance-smoke.sh"

[tasks.string-conformance-smoke]
description = "Run copied-byte String conformance against Zig and Rust floors"
run = "bash scripts/string-conformance-smoke.sh"

[tasks.prototype-conformance-smoke]
description = "Run prototype and singleton conformance against Zig and Rust floors"
run = "bash scripts/prototype-conformance-smoke.sh"

[tasks.rust-store-mop-smoke]
description = "Run Store MOP consistency tests against Rust debug and release floors"
run = "bash scripts/rust-store-mop-smoke.sh"

[tasks.rust-lower-rung-matrix]
description = "Run the isolated first downstream matrix against Zig and Rust floors"
run = "bash scripts/rust-lower-rung-matrix.sh"

[tasks.bootstrap-smoke]
description = "Cold-build a fixture-free source archive with pinned Zig and Rust"
run = "bash scripts/source-bootstrap-smoke.sh"

[tasks.verify]
description = "Run every native, self-hosted, and REPL verification gate"
run = "zig build verify"

[tasks.install]
description = "Install bin/birnam + module dylibs to a prefix (default ~/.local)"
run = """
zig build install --prefix ${BIRNAM_PREFIX:-$HOME/.local}
# Stage wrapped C libs (built via `birnam wrap`) into the same known module dir
# so `Module load:` resolves them by bare name. Best-effort.
cp wrapped/*/lib*.dylib "${BIRNAM_PREFIX:-$HOME/.local}/lib/" 2>/dev/null || true
"""

[tasks.dist]
description = "Build a portable release tarball for the current platform"
run = "./scripts/dist.sh"

[tasks.release]
description = "Bump version, build, tag, and publish a GitHub release (patch|minor|major)"
run = "./scripts/release.sh {{arg(name='level')}}"

[tasks.bench]
description = "Run the full benchmark suite (ReleaseSafe) — results to bench/results/dev/ (docs/misc/BENCHMARKS.md)"
run = "./scripts/bench.sh"

[tasks.bench-release]
description = "Tracked benchmark snapshot -> bench/results/v<VERSION>.json (run after a release, on the tagged commit, quiet machine; then commit the file)"
run = "./scripts/bench.sh --release"

[tasks.bench-compare]
description = "Diff two merged benchmark results; exits 1 on regression past threshold"
run = "./scripts/bench-compare.sh {{arg(name='old')}} {{arg(name='new')}}"
