# mise (https://mise.jdx.dev) — pins the toolchain and exposes common tasks.
#   mise run clean          # remove generated outputs and project artifacts
#   mise install            # fetch the pinned Zig
#   mise run build          # zig build (Debug)
#   mise run verify         # full native + self-hosted + REPL test gate
#   mise run rust-check     # offline Cargo check for the isolated Rust workspace
#   mise run rust-test      # offline Cargo tests for the isolated Rust workspace
#   mise run bootstrap-smoke # build a fixture-free source archive with pinned tools
#   mise run install        # install to a prefix
#   mise run dist           # build a release tarball for this platform
#   mise run release minor  # bump version, tag, build, publish a GitHub release
#   mise run bench          # full benchmark run (ReleaseSafe) -> bench/results/dev/
#   mise run bench-release  # tracked snapshot -> bench/results/v<VERSION>.json
#                           # (run AFTER release, on the tagged commit; commit the file)
#   mise run bench-compare bench/results/v0.8.0.json bench/results/dev/bench-<sha>.json

[tools]
zig = "0.15.1"
rust = "1.95.0"

[tasks.build]
description = "Build everything (Debug)"
run = "zig build"

[tasks.clean]
description = "Remove generated build outputs, Zig cache, and project artifacts"
run = "rm -rf .zig-cache zig-out .birnam .cargo-target"

[tasks.rust-check]
description = "Check the Rust floor workspace without network access"
run = "CARGO_TARGET_DIR=.cargo-target cargo check --workspace --locked --offline"

[tasks.rust-test]
description = "Test the Rust floor workspace without network access"
run = "CARGO_TARGET_DIR=.cargo-target cargo test --workspace --locked --offline"

[tasks.bootstrap-smoke]
description = "Cold-build a fixture-free source archive with pinned Zig and Rust"
run = "bash scripts/source-bootstrap-smoke.sh"

[tasks.verify]
description = "Run every native, self-hosted, and REPL verification gate"
run = "zig build verify"

[tasks.install]
description = "Install bin/birnam + module dylibs to a prefix (default ~/.local)"
run = """
zig build install --prefix ${BIRNAM_PREFIX:-$HOME/.local}
# Stage wrapped C libs (built via `birnam wrap`) into the same known module dir
# so `Module load:` resolves them by bare name. Best-effort.
cp wrapped/*/lib*.dylib "${BIRNAM_PREFIX:-$HOME/.local}/lib/" 2>/dev/null || true
"""

[tasks.dist]
description = "Build a portable release tarball for the current platform"
run = "./scripts/dist.sh"

[tasks.release]
description = "Bump version, build, tag, and publish a GitHub release (patch|minor|major)"
run = "./scripts/release.sh {{arg(name='level')}}"

[tasks.bench]
description = "Run the full benchmark suite (ReleaseSafe) — results to bench/results/dev/ (docs/misc/BENCHMARKS.md)"
run = "./scripts/bench.sh"

[tasks.bench-release]
description = "Tracked benchmark snapshot -> bench/results/v<VERSION>.json (run after a release, on the tagged commit, quiet machine; then commit the file)"
run = "./scripts/bench.sh --release"

[tasks.bench-compare]
description = "Diff two merged benchmark results; exits 1 on regression past threshold"
run = "./scripts/bench-compare.sh {{arg(name='old')}} {{arg(name='new')}}"
