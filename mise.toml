# mise (https://mise.jdx.dev) — pins the Rust toolchain and exposes common tasks.
#   mise run clean          # remove generated outputs and project artifacts
#   mise install            # fetch the pinned Rust toolchain
#   mise run build          # build the Rust development prefix
#   mise run verify         # bounded everyday correctness
#   mise run verify-release # exhaustive checks plus independent cold builds
#   mise run test           # birnam-level module suites (complements verify)
#   mise run install        # install the Rust prefix
#   mise run dist           # build a Rust release tarball
#   mise run release minor  # bump version, tag, build, publish
#   mise run bench          # isolated Rust ReleaseSafe benchmark

[tools]
rust = "1.95.0"

[tasks.build]
description = "Build the Rust development prefix"
run = """
prefix="${BIRNAM_PREFIX:-$HOME/.local/opt/birnam}"
scripts/rust-install.sh install --root "$PWD" --prefix "$prefix" --profile debug --build-cache "$PWD/.cargo-target/install"
"""

[tasks.clean]
description = "Remove Rust build outputs and project artifacts"
run = "rm -rf .birnam .cargo-target"

[tasks.rust-check]
description = "Check the Rust workspace without network access"
run = "CARGO_TARGET_DIR=.cargo-target cargo check --workspace --locked --offline"

[tasks.rust-test]
description = "Test the Rust workspace without network access"
run = "CARGO_TARGET_DIR=.cargo-target cargo test --workspace --locked --offline"

[tasks.rust-miri]
description = "Run the pure-Rust floor tests under nightly Miri"
run = "cargo +nightly miri test --workspace --locked --offline"

[tasks.deopt-experiment]
description = "Run the test-only Design 74F same-frame recovery experiment"
run = "python3 scripts/same-frame-deopt.py"

[tasks.root-registry]
description = "Check native root registration, snapshots and admission (debug)"
run = "scripts/root-registry-test.sh"

[tasks.gc-settings]
description = "Check native GC settings, allocation policy and admission (debug)"
run = "scripts/gc-settings-test.sh"
[tasks.native-stack]
description = "Check native stack anchor, word scanning and collection (debug)"
run = "scripts/native-stack-test.sh"

[tasks.mutation-epoch]
description = "Check Vtable epoch ownership, exact mutation counts, live dispatch and host admission (debug)"
run = "scripts/mutation-epoch-test.sh"

[tasks.key-index]
description = "Check derived Vtable key-index ownership, threshold transitions, live lookup and host admission (debug)"
run = "scripts/key-index-test.sh"

[tasks.deferred-identity]
description = "Check deferred identity ownership, mixed journals, exhaustion, recovery and host admission (debug)"
run = "scripts/deferred-identity-test.sh"

[tasks.deferred-index]
description = "Check lazy deferred-clone index ownership, ordered recovery, capacity and host admission (debug)"
run = "scripts/deferred-index-test.sh"

[tasks.siphon]
description = "Check the production Siphon-to-Id handoff without upper modules"
run = "scripts/siphon-test.sh"

[tasks.native-messages]
description = "Build and check production modules using only Id messages"
run = "scripts/native-message-test.sh"

[tasks.native-modules]
description = "Check production native modules, construction prefixes and live message dispatch"
run = 'python3 scripts/id-native-loading-smoke.py "${BIRNAM_PREFIX:-$HOME/.local/opt/birnam}"'

[tasks.reflection-boundaries]
description = "Check production namespace admission, native enumeration, typed errors and GC"
run = "bash scripts/runtime-services-test.sh '' reflection"

[tasks.generated-deopt-experiment]
description = "Run Design 74G generated same-frame recovery and native unload checks"
run = "python3 scripts/generated-frame-deopt.py"

[tasks.read-reuse-experiment]
description = "Run Design 74H guarded Frame read reuse correctness checks"
run = "python3 scripts/frame-read-reuse.py"

[tasks.deopt-api-experiment]
description = "Run Design 74I guard-boundary checks through the frozen IdApi"
run = "python3 scripts/deopt-public-api.py"

[tasks.native-tier-test]
description = "Check portable native-tier recovery and guarded lookup in debug and release"
run = "python3 scripts/runtime-native-tier.py --design 74L --output .cargo-target/native-tier-correctness.json"

[tasks.rust-dylib-audit]
description = "Audit Rust floor dependencies, install name, paths, and exports"
run = "bash scripts/rust-dylib-audit.sh"

[tasks.rust-store-stack-smoke]
description = "Probe the canonical Rust Store and runtime stack"
run = "bash scripts/rust-store-stack-smoke.sh"

[tasks.rust-project-check-smoke]
description = "Exercise the Rust-host project workflow"
run = "bash scripts/rust-project-check-smoke.sh"

[tasks.test]
description = "Run the birnam-level module suites (set BIRNAM_TEST_PREFIX to reuse a prefix)"
run = "bash scripts/birnam-test.sh"

[tasks.birnam-test]
description = "Alias for the birnam-level module suites"
run = "bash scripts/birnam-test.sh"

[tasks.emacs-test]
description = "Run the birnam-mode ERT suite (set BIRNAM_EMACS to pick an Emacs)"
run = "bash scripts/emacs-test.sh"

[tasks.verify]
description = "Run bounded everyday correctness (use verify-plan to preview)"
run = "python3 scripts/validate.py --suite routine"

[tasks.verify-plan]
description = "List everyday checks and deadlines without executing them"
run = "python3 scripts/validate.py --suite routine --plan"

[tasks.verify-exhaustive]
description = "Run complete compiler/recovery matrices for relevant changes"
run = "python3 scripts/validate.py --suite exhaustive"

[tasks.verify-performance]
description = "Bounded practical slowdown screen; no quiet-host wait"
run = "python3 scripts/validate.py --suite performance"

[tasks.verify-release]
description = "Run exhaustive correctness plus independent cold-source release proof"
run = "python3 scripts/validate.py --suite release"

[tasks.rust-cutover-verify]
description = "Alias for the Rust source-build, publication, cold-archive, and relocation gate"
run = "bash scripts/rust-cutover-verify.sh"

[tasks.install]
description = "Install the Rust production Birnam prefix"
run = """
prefix="${BIRNAM_PREFIX:-$HOME/.local/opt/birnam}"
scripts/rust-install.sh install --root "$PWD" --prefix "$prefix" --profile debug
if [ -z "${BIRNAM_PREFIX:-}" ]; then
  mkdir -p "$HOME/.local/bin"
  ln -sfn "$prefix/bin/birnam" "$HOME/.local/bin/birnam"
fi
"""

[tasks.dist]
description = "Build a portable Rust release tarball for the current platform"
run = "./scripts/dist.sh"

[tasks.release]
description = "Bump version, build, tag, and publish a Rust GitHub release (patch|minor|major)"
run = "./scripts/release.sh {{arg(name='level')}}"

[tasks.bench]
description = "Run the Rust benchmark suite in an isolated ReleaseSafe prefix"
run = "./scripts/bench.sh --floor=rust"

[tasks.bench-rust]
description = "Run the Rust benchmark suite"
run = "./scripts/bench.sh --floor=rust"

[tasks.bench-rust-tcc]
description = "Run the Rust benchmark suite with the Rust TCC rung"
run = "BENCH_TCC=rust ./scripts/bench.sh --floor=rust"

[tasks.bench-release]
description = "Tracked Rust benchmark snapshot with commit and dylib digest"
run = "./scripts/bench.sh --release --floor=rust"

[tasks.bench-release-rust]
description = "Tracked Rust benchmark snapshot"
run = "./scripts/bench.sh --release --floor=rust"

[tasks.bench-compare]
description = "Diff two benchmark results; exits 1 on regression past threshold"
run = "./scripts/bench-compare.sh {{arg(name='old')}} {{arg(name='new')}}"

[tasks.compiled-image-startup]
description = "Check compiled image/baked startup without source compilation and explicit recovery"
run = 'bash scripts/compiled-image-startup-smoke.sh "${BIRNAM_PREFIX:-$HOME/.local/opt/birnam}"'
