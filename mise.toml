# mise (https://mise.jdx.dev) — pins the Rust toolchain and exposes common tasks.
#   mise run clean          # remove generated outputs and project artifacts
#   mise install            # fetch the pinned Rust toolchain
#   mise run build          # build the Rust development prefix
#   mise run verify         # bounded everyday correctness
#   mise run verify-release # exhaustive checks plus independent cold builds
#   mise run test           # birnam-level module suites (complements verify)
#   mise run install        # install the Rust prefix
#   mise run dist           # build a Rust release tarball
#   mise run release minor  # bump version, tag, build, publish
#   mise run bench          # isolated Rust ReleaseSafe benchmark

[tools]
rust = "1.95.0"

[tasks.build]
description = "Build the Rust development prefix"
run = """
prefix="${BIRNAM_PREFIX:-$HOME/.local/opt/birnam}"
scripts/rust-install.sh install --root "$PWD" --prefix "$prefix" --profile debug --build-cache "$PWD/.cargo-target/install"
"""

[tasks.clean]
description = "Remove Rust build outputs and project artifacts"
run = "rm -rf .birnam .cargo-target"

[tasks.rust-check]
description = "Check the Rust workspace without network access"
run = "CARGO_TARGET_DIR=.cargo-target cargo check --workspace --locked --offline"

[tasks.rust-test]
description = "Test the Rust workspace without network access"
run = "CARGO_TARGET_DIR=.cargo-target cargo test --workspace --locked --offline"

[tasks.rust-miri]
description = "Run the pure-Rust floor tests under nightly Miri"
run = "cargo +nightly miri test --workspace --locked --offline"

[tasks.deopt-experiment]
description = "Run the test-only Design 74F same-frame recovery experiment"
run = "python3 scripts/same-frame-deopt.py"

[tasks.collection-value]
description = "Check loaded collection value comparison and hashing in debug"
run = "scripts/collection-value-test.sh"

[tasks.integer-error-value]
