[package]
name = "birnam-tcc"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
birnam-abi = { path = "../birnam-abi" }
birnam-native-compiler = { path = "../birnam-native-compiler" }

[features]
# Design 74 E1: development-only guarded slot-access shims for generated code.
dev-guarded-slots = []
# Read-only diagnostics for owned baseline Unit relocation storage.
resource-metrics = ["birnam-native-compiler/resource-metrics"]
allocation-metrics = ["resource-metrics", "birnam-native-compiler/allocation-metrics"]

[dev-dependencies]
birnam-host = { path = "../birnam-host" }

[lib]
name = "birnam_tcc"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
