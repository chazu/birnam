[package]
name = "birnam-tcc"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
birnam-abi = { path = "../birnam-abi" }

[build-dependencies]
cc.workspace = true

[features]
# Design 74 E1: development-only guarded slot-access shims for generated code.
dev-guarded-slots = []

[lib]
name = "birnam_tcc"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
