[package]
name = "birnam-codegen"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "birnam_codegen"

[dependencies]
birnam-artifact = { path = "../birnam-artifact", default-features = false }
sha2.workspace = true

[features]
# Design 74G: an experimental per-PC entry; ordinary emission is unchanged.
dev-pc-specialization = []
dev-frame-read-reuse = ["dev-pc-specialization"]
# Design 74 E1: guarded slot-access emission, selected only when this feature
# is built AND BIRNAM_DEV_GUARDED_SLOTS=1 is set in the compiling process.
dev-guarded-slots = []

[lints]
workspace = true
