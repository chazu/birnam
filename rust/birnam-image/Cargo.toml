[package]
name = "birnam-image"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["module"]
module = []

[dependencies]
birnam-image-codec = { path = "../birnam-image-codec" }
birnam-abi = { path = "../birnam-abi" }
birnam-artifact = { package = "birnam-artifact-codec", path = "../birnam-artifact-codec" }
sha2.workspace = true

[lib]
name = "birnam_image"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
