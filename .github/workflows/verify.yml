name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: arm64 macOS verification
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup default 1.95.0

      - name: Verify Rust workspace offline
        run: |
          CARGO_TARGET_DIR=.cargo-target cargo check --workspace --locked --offline
          CARGO_TARGET_DIR=.cargo-target cargo test --workspace --locked --offline

      - name: Verify Rust-only production cutover
        run: bash scripts/rust-cutover-verify.sh

      - name: Cold source bootstrap
        run: bash scripts/rust-driver-cold-archive-smoke.sh
