name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full verification on the project's real target (arm64 macOS): build every
  # artifact and run the whole test suite. The integration tests load `.dylib`s
  # and read Mach-O, and the mcache uses 128-bit atomics — all correct here.
  macos:
    name: build + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - name: zig build
        run: zig build
      - name: zig build test
        run: zig build test

  # Compile-check everything on Linux. The full test suite is macOS-targeted
  # (see above), but building all targets here catches portability/codegen
  # regressions — e.g. a build-script or generator that fails to compile.
  linux-build:
    name: build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - name: zig build
        run: zig build
