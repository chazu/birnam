[workspace]
members = ["abi", "observation-abi", "seed", "object-model", "integer", "trace", "probe", "trace-probe"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
