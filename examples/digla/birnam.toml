# Digla's runnable project. The module entry and source parts are composed into
# one libbirnam_digla artifact; Termbox remains a separate optional module.

name = "digla"
version = "0.1.0"
main = "main.birnam"
load = ["diglaApp"]
source_roots = ["."]

[[module]]
entry = "../../modules/json.birnam"

[[module]]
entry = "../../modules/lsp.birnam"

[[module]]
entry = "../../modules/socket.birnam"

[[module]]
entry = "../../modules/digla/digla.birnam"
files = [
  "../../modules/digla/config.birnam",
  "../../modules/digla/session.birnam",
  "../../modules/digla/inspection.birnam",
  "../../modules/digla/local-session.birnam",
  "../../modules/digla/protocol.birnam",
  "../../modules/digla/render.birnam",
  "../../modules/digla/terminal.birnam",
  "../../modules/digla/position-map.birnam",
  "../../modules/digla/editor.birnam",
  "../../modules/digla/display-layout.birnam",
  "../../modules/digla/analysis.birnam",
  "../../modules/digla/language-service.birnam",
  "../../modules/digla/project-source.birnam",
]

[[module]]
entry = "../../modules/digla/socket-protocol.birnam"

[[module]]
entry = "../../modules/digla/reflect-accelerator.birnam"

[[module]]
entry = "../../modules/digla/termbox.birnam"
files = ["../../wrapped/termbox2/termbox2.birnam"]

[[module]]
entry = "../../modules/digla/app.birnam"

[[wrapped]]
name = "termbox2"
build = [["zig", "build-lib", "-dynamic", "-O", "ReleaseSafe", "-lc", "-I", "../../wrapped/termbox2", "-cflags", "-std=c11", "--", "../../wrapped/termbox2/termbox2.c", "--dep", "idapi", "-Mroot=../../wrapped/termbox2/termbox2_module.zig", "-Midapi=../../src/id/idapi.zig", "--cache-dir", ".birnam/cache/termbox-zig", "--global-cache-dir", ".birnam/cache/termbox-zig-global", "-femit-bin={output}"]]

[[wrapped]]
name = "diglareflect"
build = [["zig", "build-lib", "-dynamic", "-O", "ReleaseSafe", "-lc", "--dep", "idapi", "-Mroot=../../wrapped/digla-reflect/digla_reflect.zig", "-Midapi=../../src/id/idapi.zig", "--cache-dir", ".birnam/cache/digla-reflect-zig", "--global-cache-dir", ".birnam/cache/digla-reflect-zig-global", "-femit-bin={output}"]]

[run]
repl = "none"
