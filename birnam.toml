# birnam.toml — project configuration, read from the current directory.
#
# Every key here is also readable from code: [Config at: "key"] answers
# the value, or nil when the file or key is absent — nothing is required,
# and a project without a birnam.toml just works.

# The project entry point. A bare `birnam` run in this directory evaluates
# this file first, then drops into the REPL with its state live.
# main = "main.birnam"
