[workspace]
members = [
    "rust/birnam-abi",
    "rust/birnam-bootstrap",
    "rust/birnam-alien",
    "rust/birnam-alien-compiler",
    "rust/birnam-artifact",
    "rust/birnam-artifact-codec",
    "rust/birnam-boolean",
    "rust/birnam-nil",
    "rust/birnam-string",
    "rust/birnam-range",
    "rust/birnam-vector",
    "rust/birnam-map",
    "rust/birnam-codegen",
    "rust/birnam-codegen-runtime",
    "rust/birnam-native-backend",
    "rust/birnam-generation",
    "rust/birnam-collect",
    "rust/birnam-error",
    "rust/birnam-execution",
    "rust/birnam-float",
    "rust/birnam-word",
    "rust/birnam-id",
    "rust/birnam-namespace",
    "rust/birnam-integer",
    "rust/birnam-object-model",
    "rust/birnam-root-registry",
    "rust/birnam-image",
    "rust/birnam-image-codec",
    "rust/birnam-image-format",
    "rust/birnam-host",
    "rust/birnam-host-support",
    "rust/birnam-host-entry",
    "rust/birnam-host-interaction",
    "rust/birnam-host-project",
    "rust/birnam-project-build",
    "rust/birnam-project-support",
    "rust/birnam-cli",
    "rust/birnam-build",
    "rust/birnam-siphon",
    "rust/birnam-isolate",
    "rust/birnam-lang-seed",
    "rust/birnam-native-compiler",
    "rust/birnam-peg",
    "rust/birnam-portable-code",
    "rust/birnam-prelude",
    "rust/birnam-printing",
    "rust/birnam-system-gc",
    "rust/birnam-system-output",
    "rust/birnam-system-input",
    "rust/birnam-environment",
    "rust/birnam-file-io",
    "rust/birnam-block-loop",
    "rust/birnam-native-loader",
    "rust/birnam-source-loader",
    "rust/birnam-relational",
    "rust/birnam-store",
    "rust/birnam-storage",
    "rust/birnam-tcc",
    "rust/birnam-trace",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
rust_2018_idioms = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.dependencies]
cc = "1.2.56"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

# Every profile that produces a runnable floor dylib aborts rather than
# unwinding across the C ABI. Rust test harnesses retain their default unwind
# policy so pure Rust unit tests can report ordinary assertion failures.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
