[workspace]
members = [
    "rust/birnam-abi",
    "rust/birnam-bootstrap",
    "rust/birnam-alien",
    "rust/birnam-artifact",
    "rust/birnam-artifact-codec",
    "rust/birnam-boolean",
    "rust/birnam-nil",
    "rust/birnam-string",
    "rust/birnam-string-builder",
    "rust/birnam-string-collection",
    "rust/birnam-range",
    "rust/birnam-vector",
    "rust/birnam-map",
    "rust/birnam-codegen",
    "rust/birnam-codegen-runtime",
    "rust/birnam-collection",
    "rust/birnam-collection-value",
    "rust/birnam-collect",
    "rust/birnam-error",
    "rust/birnam-error-value",
    "rust/birnam-float",
    "rust/birnam-word",
    "rust/birnam-id",
    "rust/birnam-namespace",
    "rust/birnam-integer",
    "rust/birnam-object-model",
    "rust/birnam-method-observation",
    "rust/birnam-root-registry",
    "rust/birnam-lifetime",
    "rust/birnam-gc-settings",
    "rust/birnam-payload-layout",
    "rust/birnam-trace-hooks",
    "rust/birnam-finalizers",
    "rust/birnam-native-stack",
    "rust/birnam-native-mark",
    "rust/birnam-allocation-budget",
    "rust/birnam-dispatch-cache",
    "rust/birnam-image",
    "rust/birnam-host",
    "rust/birnam-isolate",
    "rust/birnam-lang",
    "rust/birnam-native-compiler",
    "rust/birnam-peg",
    "rust/birnam-portable-code",
    "rust/birnam-prelude",
    "rust/birnam-printing",
    "rust/birnam-system-gc",
    "rust/birnam-system-output",
    "rust/birnam-system-input",
    "rust/birnam-environment",
    "rust/birnam-file-io",
    "rust/birnam-block-loop",
    "rust/birnam-native-loader",
    "rust/birnam-source-loader",
    "rust/birnam-text-view",
    "rust/birnam-relational",
    "rust/birnam-store",
    "rust/birnam-storage",
    "rust/birnam-tcc",
    "rust/birnam-trace",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
rust_2018_idioms = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.dependencies]
cc = "1.2.56"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"

# Every profile that produces a runnable floor dylib aborts rather than
# unwinding across the C ABI. Rust test harnesses retain their default unwind
# policy so pure Rust unit tests can report ordinary assertion failures.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
